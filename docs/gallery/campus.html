<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>University of Calgary main campus</title><style>html,body{margin:0;background:#f9f9f7}/* AryaGraph interactive view: all colors come from theme custom properties set on .ag-app */
.ag-app{font-family:var(--ag-font);color:var(--ag-ink);background:var(--ag-bg);box-sizing:border-box;
  padding:16px;min-height:100%;-webkit-font-smoothing:antialiased}
.ag-app *,.ag-app *::before,.ag-app *::after{box-sizing:inherit}
.ag-shell{max-width:var(--ag-max-w,1200px);margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* toolbar: one row above the content it scopes */
.ag-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ag-search{position:relative;flex:1 1 220px;max-width:340px}
.ag-search input{width:100%;height:32px;border-radius:8px;border:1px solid var(--ag-border);background:var(--ag-surface);
  color:var(--ag-ink);font:inherit;font-size:13px;padding:0 10px 0 30px;outline:none}
.ag-search input:focus{border-color:var(--ag-accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--ag-accent) 18%,transparent)}
.ag-search svg{position:absolute;left:9px;top:9px;width:14px;height:14px;stroke:var(--ag-ink-3);fill:none;stroke-width:2}
.ag-results{position:absolute;top:36px;left:0;right:0;z-index:20;background:var(--ag-surface);border:1px solid var(--ag-border);
  border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:4px;margin:0;list-style:none;max-height:280px;overflow:auto}
.ag-results li{padding:6px 8px;border-radius:6px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.ag-results li small{color:var(--ag-ink-3)}
.ag-results li[aria-selected=true],.ag-results li:hover{background:color-mix(in srgb,var(--ag-ink) 6%,transparent)}
.ag-spacer{flex:1}
.ag-btn{height:32px;min-width:32px;padding:0 10px;border-radius:8px;border:1px solid var(--ag-border);background:var(--ag-surface);
  color:var(--ag-ink-2);font:inherit;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.ag-btn:hover{color:var(--ag-ink);background:color-mix(in srgb,var(--ag-ink) 5%,var(--ag-surface))}
.ag-btn[aria-pressed=true]{color:var(--ag-ink);border-color:color-mix(in srgb,var(--ag-ink) 30%,transparent)}
.ag-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ag-btn:focus-visible,.ag-n:focus-visible{outline:2px solid var(--ag-accent);outline-offset:2px}

/* stage */
.ag-stage{position:relative;border:1px solid var(--ag-border);border-radius:12px;background:var(--ag-surface);overflow:hidden;
  height:var(--ag-stage-h,70vh);touch-action:none;user-select:none;-webkit-user-select:none}
.ag-stage>svg{display:block;width:100%;height:100%;cursor:grab}
.ag-stage.ag-panning>svg{cursor:grabbing}
.ag-n{cursor:pointer}
.ag-stage.ag-dragging .ag-n{cursor:grabbing}

/* neighborhood emphasis: CSS beats the presentation attributes */
svg.ag-focus .ag-e{opacity:.05;transition:opacity .12s}
svg.ag-focus .ag-e.ag-on{opacity:.95}
svg.ag-focus .ag-n{opacity:.16;transition:opacity .12s}
svg.ag-focus .ag-n.ag-on{opacity:1}
svg.ag-focus .ag-l{opacity:.12}
svg.ag-focus .ag-l.ag-on{opacity:1;visibility:visible}
svg.ag-focus .ag-el{opacity:.1}
svg.ag-focus .ag-el.ag-on{opacity:1}
svg .ag-n.ag-sel .ag-shape{stroke:var(--ag-highlight);stroke-width:2.5}
svg.ag-labels-all .ag-l{visibility:visible}
svg.ag-labels-none .ag-l{visibility:hidden}
svg .ag-e.ag-fire{opacity:1 !important}
svg .ag-e.ag-fire .ag-edge{stroke:var(--ag-fire,#d03b3b);stroke-width:2.2}
svg .ag-e.ag-fire .ag-arrow{fill:var(--ag-fire,#d03b3b)}
.ag-legend-item{cursor:pointer}

/* tooltip: value leads, label follows */
.ag-tip{position:absolute;z-index:30;pointer-events:none;min-width:140px;max-width:300px;background:var(--ag-surface);
  border:1px solid var(--ag-border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:10px 12px;font-size:12px;line-height:1.35}
.ag-tip[hidden]{display:none}
.ag-tip b{display:block;font-size:13px;font-weight:600;color:var(--ag-ink);margin-bottom:6px;word-break:break-word}
.ag-tip dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0}
.ag-tip dt{color:var(--ag-ink-3)}
.ag-tip dd{margin:0;color:var(--ag-ink);font-variant-numeric:tabular-nums;text-align:right;word-break:break-word}

/* details panel */
.ag-panel{position:absolute;top:10px;right:10px;bottom:10px;width:min(300px,calc(100% - 20px));z-index:25;background:var(--ag-surface);
  border:1px solid var(--ag-border);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.16);padding:14px 16px;overflow:auto;font-size:12.5px}
.ag-panel[hidden]{display:none}
.ag-panel h3{margin:0 24px 4px 0;font-size:15px;font-weight:600;word-break:break-word}
.ag-panel .ag-sub{color:var(--ag-ink-3);margin-bottom:12px}
.ag-panel h4{margin:14px 0 6px;font-size:11.5px;font-weight:600;color:var(--ag-ink-2);text-transform:none}
.ag-panel dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.ag-panel dt{color:var(--ag-ink-3)}
.ag-panel dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;word-break:break-word}
.ag-panel ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.ag-panel li button{font:inherit;font-size:12px;border:1px solid var(--ag-border);background:transparent;color:var(--ag-ink);
  border-radius:999px;padding:2px 9px;cursor:pointer}
.ag-panel li button:hover{border-color:var(--ag-accent)}
.ag-close{position:absolute;top:8px;right:8px;border:0;background:transparent;color:var(--ag-ink-3);font-size:18px;cursor:pointer;line-height:1}

/* player */
.ag-player{display:grid;grid-template-columns:auto auto 1fr auto auto;align-items:center;gap:10px;padding:10px 12px;
  border:1px solid var(--ag-border);border-radius:12px;background:var(--ag-surface)}
.ag-player input[type=range]{width:100%;accent-color:var(--ag-accent)}
.ag-time{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ag-ink-2);min-width:88px;text-align:right}
.ag-player select{height:30px;border-radius:8px;border:1px solid var(--ag-border);background:var(--ag-surface);color:var(--ag-ink);font:inherit;font-size:12px}
.ag-readout{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;padding:2px 4px 6px}
.ag-ro{display:inline-flex;align-items:baseline;gap:5px}
.ag-ro i{display:inline-block;width:12px;height:3px;border-radius:2px;transform:translateY(-3px)}
.ag-ro b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ag-ink)}
.ag-ro small{color:var(--ag-ink-3);font-size:12px}
.ag-chart{border:1px solid var(--ag-border);border-radius:12px;background:var(--ag-surface);padding:6px 8px 2px;position:relative}
.ag-chart svg{display:block;width:100%;height:auto}

/* table view */
.ag-table{border:1px solid var(--ag-border);border-radius:12px;background:var(--ag-surface);overflow:auto;max-height:420px}
.ag-table[hidden]{display:none}
.ag-table table{border-collapse:collapse;width:100%;font-size:12.5px}
.ag-table th{position:sticky;top:0;background:var(--ag-surface);text-align:left;font-weight:600;color:var(--ag-ink-2);
  padding:8px 12px;border-bottom:1px solid var(--ag-grid);cursor:pointer;white-space:nowrap}
.ag-table th[aria-sort]::after{content:" ↓";color:var(--ag-ink-3)}
.ag-table th[aria-sort=ascending]::after{content:" ↑"}
.ag-table td{padding:6px 12px;border-bottom:1px solid var(--ag-grid);white-space:nowrap}
.ag-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.ag-table tr:hover td{background:color-mix(in srgb,var(--ag-ink) 4%,transparent);cursor:pointer}
.ag-foot{font-size:11.5px;color:var(--ag-ink-3);display:flex;gap:12px;flex-wrap:wrap}
.ag-foot kbd{font-family:var(--ag-mono);font-size:10.5px;border:1px solid var(--ag-border);border-radius:4px;padding:0 4px}
@media (max-width:560px){.ag-app{padding:10px}.ag-btn .ag-txt{display:none}.ag-player{grid-template-columns:auto 1fr auto}}

    // ---------------------------------------------------------------- legend
    function focusGroup(v) {
      var keys = new Set();
      data.nodes.forEach(function (n) { if (n.g !== undefined && String(n.g) === v) keys.add(n.k); });
      focusNodes(keys);
    }
    svg.querySelectorAll('.ag-legend-block[data-channel="node_color"] .ag-legend-item[data-value]').forEach(function (it) {
      var v = it.getAttribute("data-value");
      it.addEventListener("mouseenter", function () { if (!selected && groupOn === null) focusGroup(v); });
      it.addEventListener("mouseleave", function () { if (!selected && groupOn === null) focusNodes(null); });
      it.addEventListener("click", function (ev) {
        ev.stopPropagation();
        if (selected) select(null);
        groupOn = groupOn === v ? null : v;
        restore();
      });
    });

    // ---------------------------------------------------------------- toolbar
    function btn(name) { return app.querySelector('[data-act="' + name + '"]'); }
    function on(name, fn) { var b = btn(name); if (b) b.addEventListener("click", fn); }
    on("fit", fit);
    on("zoom-in", function () { zoomAt(W / 2, H / 2, 1.3); });
    on("zoom-out", function () { zoomAt(W / 2, H / 2, 1 / 1.3); });
    var labelMode = 0;
    on("labels", function () {
      labelMode = (labelMode + 1) % 3;
      svg.classList.toggle("ag-labels-all", labelMode === 1);
      svg.classList.toggle("ag-labels-none", labelMode === 2);
      btn("labels").setAttribute("aria-pressed", labelMode ? "true" : "false");
      btn("labels").querySelector(".ag-txt").textContent = ["Labels: auto", "Labels: all", "Labels: off"][labelMode];
    });
    function serialize() {
      var clone = svg.cloneNode(true);
      clone.classList.remove("ag-focus");
      clone.removeAttribute("tabindex");
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      return new XMLSerializer().serializeToString(clone);
    }
    on("svg", function () { download((data.name || "graph") + ".svg", new Blob([serialize()], { type: "image/svg+xml" })); });
    on("png", function () {
      var img = new Image(), url = URL.createObjectURL(new Blob([serialize()], { type: "image/svg+xml" }));
      img.onload = function () {
        var s = 2, c = document.createElement("canvas");
        c.width = W * s; c.height = H * s;
        var ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, W * s, H * s);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { download((data.name || "graph") + ".png", b); });
      };
      img.src = url;
    });

    // ---------------------------------------------------------------- search
    var input = app.querySelector(".ag-search input"), results = app.querySelector(".ag-results"), active = -1, matches = [];
    function renderResults() {
      results.textContent = "";
      if (!matches.length) { results.hidden = true; return; }
      matches.forEach(function (n, i) {
        var li = el("li", { role: "option", "aria-selected": i === active ? "true" : "false" });
        li.appendChild(el("span", null, n.label));
        li.appendChild(el("small", null, (adj.get(n.k).size) + " links"));
        li.addEventListener("mousedown", function (ev) { ev.preventDefault(); pick(n); });
        results.appendChild(li);
      });
      results.hidden = false;
    }
    function pick(n) { select(n.k); centerOn(n); matches = []; renderResults(); input.blur(); }
    if (input) {
      input.addEventListener("input", function () {
        var q = input.value.trim().toLowerCase();
        active = -1;
        if (!q) { matches = []; renderResults(); return; }
        var hits = [];
        data.nodes.forEach(function (n) {
          var l = n.label.toLowerCase(), id = String(n.id).toLowerCase();
          var at = l.indexOf(q), ai = id.indexOf(q);
          if (at >= 0 || ai >= 0) hits.push({ n: n, s: (at === 0 || ai === 0 ? 0 : 1), d: -adj.get(n.k).size });
        });
        hits.sort(function (a, b) { return a.s - b.s || a.d - b.d; });
        matches = hits.slice(0, 8).map(function (h) { return h.n; });
        renderResults();
      });
      input.addEventListener("keydown", function (ev) {
        if (ev.key === "ArrowDown") { active = Math.min(active + 1, matches.length - 1); renderResults(); ev.preventDefault(); }
        else if (ev.key === "ArrowUp") { active = Math.max(active - 1, 0); renderResults(); ev.preventDefault(); }
        else if (ev.key === "Enter") { if (matches.length) pick(matches[Math.max(active, 0)]); }
        else if (ev.key === "Escape") { input.value = ""; matches = []; renderResults(); }
      });
      input.addEventListener("blur", function () { setTimeout(function () { results.hidden = true; }, 120); });
    }

    // ---------------------------------------------------------------- table view
    var tableBox = app.querySelector(".ag-table"), tableBuilt = false;
    on("table", function () {
      if (!tableBox) return;
      tableBox.hidden = !tableBox.hidden;
      btn("table").setAttribute("aria-pressed", tableBox.hidden ? "false" : "true");
      if (!tableBuilt) { buildTable(); tableBuilt = true; }
    });
    function buildTable() {
      var keys = [], seen = {};
      data.nodes.forEach(function (n) {
        Object.keys((n.tip && n.tip.attrs) || {}).forEach(function (k) { if (!seen[k] && keys.length < 10) { seen[k] = 1; keys.push(k); } });
      });
      var base = data.directed ? ["in", "out"] : ["degree"];
      var cols = ["label"].concat(base, keys);
      var rows = data.nodes.map(function (n) {
        var t = n.tip || {}, at = t.attrs || {};
        return { n: n, v: cols.map(function (c) { return c === "label" ? n.label : (c in t ? t[c] : at[c]); }) };
      });
      var table = el("table"), thead = el("thead"), tr = el("tr"), tbody = el("tbody");
      var sortCol = -1, asc = false;
      cols.forEach(function (c, i) {
        var th = el("th", { scope: "col" }, c);
        th.addEventListener("click", function () {
          asc = sortCol === i ? !asc : (i === 0);
          sortCol = i;
          tr.querySelectorAll("th").forEach(function (h) { h.removeAttribute("aria-sort"); });
          th.setAttribute("aria-sort", asc ? "ascending" : "descending");
          rows.sort(function (a, b) {
            var x = a.v[i], y = b.v[i];
            if (x === undefined || x === null) return 1;
            if (y === undefined || y === null) return -1;
            var r = (typeof x === "number" && typeof y === "number") ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true });
            return asc ? r : -r;
          });
          fill();
        });
        tr.appendChild(th);
      });
      thead.appendChild(tr); table.appendChild(thead); table.appendChild(tbody); tableBox.appendChild(table);
      function fill() {
        tbody.textContent = "";
        rows.slice(0, 2000).forEach(function (r) {
          var row = el("tr");
          r.v.forEach(function (v) { row.appendChild(el("td", typeof v === "number" ? { class: "num" } : null, fmtVal(v))); });
          row.addEventListener("click", function () { select(r.n.k); centerOn(r.n); });
          tbody.appendChild(row);
        });
      }
      fill();
    }

    // ---------------------------------------------------------------- animation
    var anim = null, frame = 0, playing = false, timer = null;
    var togglePlay = function () {};
    if (data.anim) {
      var A = data.anim;
      anim = {
        n: data.nodes.length, T: A.times.length, times: A.times, states: A.states || [], palette: A.palette,
        frames: b64bytes(A.frames), values: A.values ? new Float32Array(b64bytes(A.values).buffer) : null,
        fire: A.fire || null, chart: A.chart || null, fmt: A.time_format || "t = {t}"
      };
      var slider = app.querySelector(".ag-player input[type=range]"), tlabel = app.querySelector(".ag-time");
      var readout = app.querySelector(".ag-readout"), cursor = app.querySelector(".ag-chart .ag-cursor");
      var shapeEls = data.nodes.map(function (n) { return n.el ? n.el.querySelector(".ag-shape") : null; });
      var textEls = data.nodes.map(function (n) { return n.el ? n.el.querySelector("text") : null; });
      var current = new Int16Array(anim.n).fill(-1);
      var fired = [];
      var setFrame = function (i) {
        frame = Math.max(0, Math.min(anim.T - 1, i));
        var base = frame * anim.n;
        for (var j = 0; j < anim.n; j++) {
          var c = anim.frames[base + j];
          if (c === current[j] || !shapeEls[j]) continue;
          current[j] = c;
          var p = anim.palette[c];
          shapeEls[j].setAttribute("fill", p[0]);
          if (p[1]) shapeEls[j].setAttribute("stroke", p[1]);
          if (p[2] && textEls[j]) textEls[j].setAttribute("fill", p[2]);
        }
        fired.forEach(function (e) { e.classList.remove("ag-fire"); });
        fired = [];
        if (anim.fire && anim.fire[frame]) anim.fire[frame].forEach(function (ei) { var e = edges[ei]; if (e && e.el) { e.el.classList.add("ag-fire"); fired.push(e.el); } });
        if (slider) slider.value = frame;
        var t = anim.times[frame];
        if (tlabel) tlabel.textContent = anim.fmt.replace("{t}", fmtVal(Math.round(t * 1000) / 1000)).replace("{i}", frame);
        if (cursor && anim.chart) {
          var ch = anim.chart, x = ch.x0 + (t - ch.t0) / ((ch.t1 - ch.t0) || 1) * (ch.x1 - ch.x0);
          cursor.setAttribute("x1", fmt(x)); cursor.setAttribute("x2", fmt(x));
        }
        if (readout && !anim.values) {
          var counts = new Array(anim.states.length).fill(0);
          for (var q = 0; q < anim.n; q++) counts[anim.frames[base + q]]++;
          readout.textContent = "";
          anim.states.forEach(function (s, si) {
            var span = el("span", { class: "ag-ro" });
            var key = el("i"); key.style.background = anim.palette[si][3] || anim.palette[si][0];
            span.appendChild(key); span.appendChild(el("b", null, counts[si].toLocaleString())); span.appendChild(el("small", null, s));
            readout.appendChild(span);
          });
        }
      };
      var speedSel = app.querySelector(".ag-player select");
      var fps = function () { return Math.max(3, Math.min(30, anim.T / 10)) * (speedSel ? +speedSel.value : 1); };
      var tick = function () {
        if (!playing) return;
        if (frame >= anim.T - 1) { stop(); return; }
        setFrame(frame + 1);
        timer = setTimeout(tick, 1000 / fps());
      };
      var playBtn = btn("play");
      var stop = function () { playing = false; clearTimeout(timer); if (playBtn) { playBtn.setAttribute("aria-pressed", "false"); playBtn.querySelector(".ag-txt").textContent = "Play"; } };
      togglePlay = function () {
        if (playing) { stop(); return; }
        if (frame >= anim.T - 1) setFrame(0);
        playing = true;
        if (playBtn) { playBtn.setAttribute("aria-pressed", "true"); playBtn.querySelector(".ag-txt").textContent = "Pause"; }
        tick();
      };
      on("play", function () { togglePlay(); });
      on("step-back", function () { stop(); setFrame(frame - 1); });
      on("step-fwd", function () { stop(); setFrame(frame + 1); });
      if (slider) { slider.max = anim.T - 1; slider.addEventListener("input", function () { stop(); setFrame(+slider.value); }); }
      var chartBox = app.querySelector(".ag-chart svg");
      if (chartBox && anim.chart) {
        chartBox.addEventListener("pointermove", function (ev) {
          if (ev.buttons !== 1) return;
          var p = chartBox.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
          var q = p.matrixTransform(chartBox.getScreenCTM().inverse()), ch = anim.chart;
          var t = ch.t0 + (q.x - ch.x0) / (ch.x1 - ch.x0) * (ch.t1 - ch.t0), best = 0;
          for (var i = 0; i < anim.T; i++) if (Math.abs(anim.times[i] - t) < Math.abs(anim.times[best] - t)) best = i;
          stop(); setFrame(best);
        });
        chartBox.addEventListener("pointerdown", function (ev) { chartBox.setPointerCapture(ev.pointerId); chartBox.dispatchEvent(new PointerEvent("pointermove", { clientX: ev.clientX, clientY: ev.clientY, buttons: 1 })); });
      }
      setFrame(data.anim.start || 0);
      if (data.anim.autoplay) togglePlay();
    }

    apply();
    app.agReady = true;
  }

  function boot() {
    document.querySelectorAll(".ag-app").forEach(function (app) {
      if (app.agReady) return;
      try { init(app); } catch (err) { app.setAttribute("data-error", String(err && err.message || err)); if (window.console) console.error(err); }
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script></body></html>
