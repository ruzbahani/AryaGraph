[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aryagraph"
version = "0.1.1"
description = "AryaGraph: graph & DAG visualization, analysis and simulation for Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ali Mohammadi Ruzbahani" }]
maintainers = [{ name = "Ali Mohammadi Ruzbahani" }]
keywords = [
    "graph",
    "network",
    "dag",
    "visualization",
    "graph-layout",
    "sugiyama",
    "network-analysis",
    "simulation",
    "epidemic",
    "scheduling",
    "svg",
    "interactive",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://ruzbahani.com/aryagraph"
Documentation = "https://ruzbahani.com/aryagraph"
Source = "https://github.com/ruzbahani/AryaGraph"
Issues = "https://github.com/ruzbahani/AryaGraph/issues"
DOI = "https://doi.org/10.5281/zenodo.22928604"

[project.optional-dependencies]
interop = ["networkx>=3.0", "pandas>=1.5", "scipy>=1.9"]
png = ["cairosvg>=2.5"]
test = ["pytest>=7", "networkx>=3.4", "pandas>=1.5", "scipy>=1.9"]

[project.scripts]
aryagraph = "aryagraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aryagraph = ["render/assets/*", "generators/data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
