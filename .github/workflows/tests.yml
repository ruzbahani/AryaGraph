name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          python -m pip install pytest-github-actions-annotate-failures
      - name: Show versions
        run: python -c "import sys, numpy, networkx, scipy, pandas; print(sys.version); print('numpy', numpy.__version__, '| networkx', networkx.__version__, '| scipy', scipy.__version__, '| pandas', pandas.__version__)"
      - name: Run the test suite
        run: python -m pytest -q -rs --tb=short
